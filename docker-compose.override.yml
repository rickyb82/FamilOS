services:
  wordcraft:
    build:
      additional_contexts:
        craft_src: ./craft/wordcraft
      secrets: !reset []
  wordcraft-web:
    build:
      additional_contexts:
        craft_src: ./craft/wordcraft
      secrets: !reset []
  gridcraft:
    environment:
      MCP_ARGS: "--automation-read-root /data --automation-write-root /data/gridcraft"
    build:
      additional_contexts:
        craft_src: ./craft/gridcraft
      secrets: !reset []
  gridcraft-web:
    build:
      additional_contexts:
        craft_src: ./craft/gridcraft
      secrets: !reset []
  pdfcraft:
    environment:
      MCP_ARGS: "--root /data --compact --automation-read-root /data --automation-write-root /data/pdfcraft"
    build:
      additional_contexts:
        craft_src: ./craft/pdfcraft
      secrets: !reset []
  pdfcraft-web:
    build:
      additional_contexts:
        craft_src: ./craft/pdfcraft
      secrets: !reset []
  deckcraft:
    environment:
      MCP_ARGS: "--automation-read-root /data --automation-write-root /data/deckcraft"
    build:
      additional_contexts:
        craft_src: ./craft/deckcraft
      secrets: !reset []
  deckcraft-web:
    build:
      additional_contexts:
        craft_src: ./craft/deckcraft
      secrets: !reset []
  ideacraft:
    environment:
      MCP_ARGS: "--automation-read-root /data --automation-write-root /data/ideacraft"
    build:
      additional_contexts:
        craft_src: ./craft/ideacraft
      secrets: !reset []
  ideacraft-web:
    build:
      additional_contexts:
        craft_src: ./craft/ideacraft
      secrets: !reset []
  mailcraft:
    build:
      additional_contexts:
        craft_src: ./craft/mailcraft
      secrets: !reset []
